name = "phx-beauty-v1"
main = "src/worker.ts"
compatibility_date = "2026-06-30"
workers_dev = true
preview_urls = true

[[routes]]
pattern = "phx.beauty"
custom_domain = true

[[routes]]
pattern = "www.phx.beauty"
custom_domain = true

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "404-page"
html_handling = "auto-trailing-slash"
run_worker_first = ["/api/*"]
